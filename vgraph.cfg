# Dependency directions checked by `nimble checkVGraph`. See ADR-0001.

# Layers inside src/, lowest first. A module may import its own layer and any
# lower one, never a higher one. A name matches a file (c_api ->
# c_api.nim) or a directory (common -> common/*.nim, symbology -> symbology/*.nim).
# Modules under no listed layer are unconstrained: the umbrella facade
# re-exports everything.
[layers]
common
symbology
render
c_api

# Uni* engines this repo may name in `requires`. Any Uni* absent here is a
# back-edge in the family DAG. Non-Uni deps (nim, NimContracts) are external
# infra and go unchecked. UniVector, UniImage and UniColor are the direct
# dependencies; UniLinalg and UniMath arrive transitively through them and are
# listed so naming one directly stays a reviewed decision rather than an error.
[engines]
UniVector
UniImage
UniColor
UniLinalg
UniMath
